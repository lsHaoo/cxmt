<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跳转到 Chat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0f0f1a;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: #1a1a2e;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      color: #888;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #ccc;
      margin-bottom: 8px;
    }

    .input-group textarea {
      width: 100%;
      padding: 12px 16px;
      background: #0f0f1a;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      color: #eee;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      min-height: 100px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group textarea:focus {
      border-color: #667eea;
    }

    .buttons {
      display: flex;
      gap: 12px;
    }

    button {
      flex: 1;
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button.secondary {
      background: #2a2a4a;
    }

    button.secondary:hover {
      background: #3a3a5a;
    }

    .examples {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #2a2a4a;
    }

    .examples h3 {
      font-size: 14px;
      font-weight: 600;
      color: #ccc;
      margin-bottom: 12px;
    }

    .example-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 8px 14px;
      background: #2a2a4a;
      border: 1px solid #3a3a5a;
      border-radius: 20px;
      font-size: 13px;
      color: #ccc;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip:hover {
      background: #3a3a5a;
      color: #eee;
      border-color: #667eea;
    }

    @media (max-width: 768px) {
      .container {
        padding: 20px;
      }

      h1 {
        font-size: 22px;
      }

      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>发送消息到 Chat</h1>
    <p>输入您的消息，然后跳转到聊天界面。消息将自动发送并开始对话。</p>

    <div class="input-group">
      <label for="message">消息内容</label>
      <textarea
        id="message"
        placeholder="输入您想发送的消息..."
      >你好，请帮我分析一下这段代码的优缺点。</textarea>
    </div>

    <div class="buttons">
      <button onclick="sendAndJump()">发送并跳转</button>
      <button class="secondary" onclick="jumpOnly()">仅跳转</button>
    </div>

    <div class="examples">
      <h3>快捷示例</h3>
      <div class="example-chips">
        <div class="chip" onclick="useExample('帮我写一个 React 组件')">写 React 组件</div>
        <div class="chip" onclick="useExample('解释一下这个概念')">解释概念</div>
        <div class="chip" onclick="useExample('优化这段代码')">优化代码</div>
        <div class="chip" onclick="useExample('翻译成英文')">翻译</div>
        <div class="chip" onclick="useExample('生成测试用例')">生成测试</div>
        <div class="chip" onclick="useExample('总结要点')">总结</div>
      </div>
    </div>
  </div>

  <script>
    const messageInput = document.getElementById('message');

    // 使用示例消息
    function useExample(text) {
      messageInput.value = text;
      messageInput.focus();
    }

    // 仅跳转到聊天界面
    function jumpOnly() {
      window.location.href = '/?message=' + encodeURIComponent(messageInput.value);
    }

    // 发送消息并跳转到聊天界面
    function sendAndJump() {
      const message = messageInput.value.trim();
      if (!message) {
        alert('请输入消息内容');
        return;
      }

      // 方法1: 通过 URL 参数传递消息
      // 跳转到聊天界面，消息会自动发送
      window.location.href = '/?message=' + encodeURIComponent(message);
    }

    // 页面加载时检查是否有来自其他页面的消息
    window.addEventListener('load', () => {
      const params = new URLSearchParams(window.location.search);
      const message = params.get('message');
      const fromPage = params.get('from');

      if (message) {
        console.log('收到来自', fromPage || '外部页面', '的消息:', message);

        // 发送 postMessage 到父页面（如果有）
        if (window.opener) {
          window.opener.postMessage({
            type: 'CHAT_MESSAGE',
            message: message,
            from: window.location.pathname
          }, '*');
        }

        // 清除 URL 参数，避免重复
        const url = new URL(window.location);
        url.searchParams.delete('message');
        url.searchParams.delete('from');
        window.history.replaceState({}, '', url.toString());
      }
    });

    // 监听来自其他页面的消息
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'CHAT_MESSAGE') {
        console.log('收到来自其他页面的消息:', event.data);
        messageInput.value = event.data.message;
        messageInput.focus();
      }
    });

    // 监听来自 iframe 的响应
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'CHAT_RESPONSE') {
        console.log('收到聊天响应:', event.data);
        if (event.data.success) {
          alert('消息发送成功！');
        } else {
          alert('消息发送失败: ' + event.data.error);
        }
      }
    });
  </script>
</body>
</html>
