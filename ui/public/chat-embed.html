<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenClaw Chat Embed</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0f0f1a;
      color: #eee;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .controls {
      padding: 20px;
      background: #1a1a2e;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    .controls h1 {
      font-size: 18px;
      font-weight: 600;
      margin-right: auto;
      color: #eee;
    }

    .input-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .input-group input {
      padding: 10px 14px;
      background: #0f0f1a;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      color: #eee;
      font-size: 14px;
      width: 400px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: #667eea;
    }

    .input-group button {
      padding: 10px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .input-group button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .input-group button:active {
      transform: translateY(0);
    }

    .input-group button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      padding: 8px 16px;
      background: #1a1a2e;
      border-radius: 6px;
      font-size: 13px;
      color: #888;
    }

    .status.success {
      color: #4ade80;
    }

    .status.error {
      color: #f87171;
    }

    .status.sending {
      color: #fbbf24;
    }

    .quick-actions {
      display: flex;
      gap: 8px;
    }

    .quick-actions button {
      padding: 8px 14px;
      background: #2a2a4a;
      border: 1px solid #3a3a5a;
      border-radius: 6px;
      color: #ccc;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quick-actions button:hover {
      background: #3a3a5a;
      color: #eee;
    }

    .iframe-container {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }

    @media (max-width: 768px) {
      .controls {
        flex-direction: column;
        align-items: stretch;
      }

      .controls h1 {
        text-align: center;
      }

      .input-group input {
        width: 100%;
      }

      .input-group {
        flex-direction: column;
      }

      .input-group button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="controls">
    <h1>OpenClaw Chat Controller</h1>
    <div class="input-group">
      <input
        type="text"
        id="messageInput"
        placeholder="输入要发送的消息..."
        value="Hello, how can you help me today?"
      >
      <button id="sendButton">发送消息</button>
    </div>
    <div class="status" id="status">准备就绪</div>
    <div class="quick-actions">
      <button onclick="quickMessage('帮我写一段代码')">写代码</button>
      <button onclick="quickMessage('翻译这段文本')">翻译</button>
      <button onclick="quickMessage('总结以下内容')">总结</button>
    </div>
  </div>
  <div class="iframe-container">
    <!-- 使用相对路径嵌入 chat 页面 -->
    <iframe id="chatFrame" src="/" allow="clipboard-read; clipboard-write"></iframe>
  </div>

  <script>
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');
    const status = document.getElementById('status');
    const chatFrame = document.getElementById('chatFrame');

    // 状态管理
    let isSending = false;
    let messageId = 0;

    // 更新状态显示
    function setStatus(text, type = '') {
      status.textContent = text;
      status.className = 'status ' + type;
    }

    // 生成唯一消息ID
    function generateMessageId() {
      return 'msg_' + Date.now() + '_' + (++messageId);
    }

    // 发送消息到 iframe
    function sendMessageToChat() {
      const message = messageInput.value.trim();
      if (!message) {
        setStatus('请输入消息内容', 'error');
        return;
      }

      if (isSending) {
        setStatus('正在发送...', 'sending');
        return;
      }

      isSending = true;
      const msgId = generateMessageId();
      setStatus('发送中...', 'sending');
      sendButton.disabled = true;

      // 发送 postMessage 到 iframe
      try {
        chatFrame.contentWindow.postMessage({
          type: 'CIMICLAW_TASK',
          id: msgId,
          message: message,
          timestamp: Date.now()
        }, '*');
        console.log('发送消息到 iframe:', message, 'ID:', msgId);
      } catch (error) {
        setStatus('发送失败: ' + error.message, 'error');
        isSending = false;
        sendButton.disabled = false;
      }
    }

    // 快捷消息
    function quickMessage(text) {
      messageInput.value = text;
      sendMessageToChat();
    }

    // 点击发送按钮
    sendButton.addEventListener('click', sendMessageToChat);

    // 按回车发送
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessageToChat();
      }
    });

    // 监听 iframe 加载完成
    chatFrame.addEventListener('load', () => {
      console.log('Chat iframe 加载完成');
      setStatus('已连接到聊天界面', 'success');
    });

    // 监听来自 iframe 的消息响应
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'CHAT_RESPONSE') {
        isSending = false;
        sendButton.disabled = false;

        if (event.data.success) {
          setStatus('消息发送成功！', 'success');
          console.log('收到来自 iframe 的成功响应:', event.data);

          // 清空输入框
          messageInput.value = '';
          messageInput.focus();

          // 3秒后重置状态
          setTimeout(() => {
            setStatus('准备就绪');
          }, 3000);
        } else {
          setStatus('消息发送失败: ' + (event.data.error || '未知错误'), 'error');
          console.error('收到来自 iframe 的错误响应:', event.data);
        }
      }
    });

    // 页面加载完成后自动聚焦到输入框
    window.addEventListener('load', () => {
      console.log('页面加载完成');
      messageInput.focus();
    });
  </script>
</body>
</html>
